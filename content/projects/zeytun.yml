title: Zeytun
short: App-aware network control for macOS
description: Free, open-source macOS app that shows which apps are making which connections and lets you decide how each one is routed — per-app rules, temporary rules, DNS controls and a live traffic monitor, built on a sing-box derived core. Alpha, being hardened toward a stable release.
year: "2026"
category: desktop
stack: [Tauri, Rust, SvelteKit, sing-box]
